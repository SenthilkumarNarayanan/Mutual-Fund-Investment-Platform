
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**

            - id: fund-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/funds/**

            - id: investment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/investments/**

server:
  port: 8080

logging:
  level:
    root: INFO
    com.mfplatform: DEBUG

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway
